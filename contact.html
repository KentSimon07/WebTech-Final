<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Kent Simon</title>
    <link rel="stylesheet" href="assets/css/site.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="bg-light-grey text-slate min-h-screen flex flex-col">
    <header class="bg-navy text-white">
      <nav
        class="max-w-6xl mx-auto flex items-center justify-between p-4"
        aria-label="Main navigation"
      >
        <a href="index.html" class="text-xl font-bold">Kent Simon</a>
        <button
          id="menu-btn"
          class="md:hidden text-2xl"
          aria-label="Open menu"
          aria-expanded="false"
        >
          <i class="fa-solid fa-bars"></i>
        </button>
        <ul
          id="menu"
          class="hidden md:flex md:gap-6 absolute md:static top-16 left-0 w-full md:w-auto bg-navy p-4 md:p-0"
        >
          <li>
            <a href="index.html" class="block py-2 hover:text-blue">Home</a>
          </li>
          <li>
            <a href="about.html" class="block py-2 hover:text-blue">About</a>
          </li>
          <li>
            <a href="resume.html" class="block py-2 hover:text-blue">Resumé</a>
          </li>
          <li>
            <a href="projects.html" class="block py-2 hover:text-blue"
              >Projects</a
            >
          </li>
          <li>
            <a href="mywork.html" class="block py-2 hover:text-blue">My Work</a>
          </li>
          <li>
            <a href="contact.html" class="block py-2 text-blue">Contact</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="flex-1 max-w-xl mx-auto w-full p-4">
      <section
        class="bg-white rounded-lg shadow p-6 my-8"
        aria-labelledby="contact-heading"
      >
        <h1
          id="contact-heading"
          class="text-3xl font-bold text-navy text-center mb-6"
        >
          Contact Me
        </h1>

        <form id="contact-form" action="contact.html" method="get" novalidate>
          <label for="name" class="block font-semibold text-navy">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            class="w-full border border-slate rounded p-2 mt-1"
          />
          <p id="name-error" class="text-red-500 text-sm mt-1 mb-4"></p>

          <label for="email" class="block font-semibold text-navy">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="w-full border border-slate rounded p-2 mt-1"
          />
          <p id="email-error" class="text-red-500 text-sm mt-1 mb-4"></p>

          <label for="message" class="block font-semibold text-navy"
            >Message</label
          >
          <textarea
            id="message"
            name="message"
            rows="5"
            class="w-full border border-slate rounded p-2 mt-1"
          ></textarea>
          <p id="message-error" class="text-red-500 text-sm mt-1 mb-4"></p>

          <button
            type="submit"
            class="w-full bg-blue text-white font-bold py-3 rounded hover:bg-navy"
          >
            Send
          </button>
        </form>
      </section>
    </main>

    <footer class="bg-navy text-white">
      <div class="max-w-6xl mx-auto flex items-center justify-between p-4">
        <p>&copy; 2026 Kent Simon</p>
        <ul class="flex gap-4 text-xl">
          <li>
            <a href="https://github.com/KentSimon07" aria-label="GitHub"
              ><i class="fa-brands fa-github"></i
            ></a>
          </li>
          <li>
            <a href="https://www.linkedin.com/" aria-label="LinkedIn"
              ><i class="fa-brands fa-linkedin"></i
            ></a>
          </li>
          <li>
            <a
              href="https://www.instagram.com/kenttsimon"
              aria-label="Instagram"
              ><i class="fa-brands fa-instagram"></i
            ></a>
          </li>
        </ul>
      </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/contact.js"></script>
  </body>
</html>
