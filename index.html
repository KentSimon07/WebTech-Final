    <header class="bg-navy text-white">
      <nav
        class="max-w-6xl mx-auto flex items-center justify-between p-4"
        aria-label="Main navigation"
      >
        <a href="index.html" class="text-xl font-bold">Kent Simon</a>
        <button
          id="menu-btn"
          class="md:hidden text-2xl"
          aria-label="Open menu"
          aria-expanded="false"
        >
          <i class="fa-solid fa-bars"></i>
        </button>
        <ul
          id="menu"
          class="hidden md:flex md:gap-6 absolute md:static top-16 left-0 w-full md:w-auto bg-navy p-4 md:p-0"

          <li>

            >

          <li>

          <li>
            <a href="contact.html" class="block py-2 hover:text-blue"

            >
          </li>
        </ul>

    <main class="flex-1 max-w-6xl mx-auto w-full p-4">
      <section
        class="py-8 md:flex md:items-center md:gap-8"
        aria-labelledby="hero-heading"

        <img

          class="w-full md:w-1/2 rounded-lg"

            class="text-3xl md:text-5xl font-bold text-navy"
          >
            Kent Simon
          </h1>
          <p class="mt-3">
            Programming student at North Metropolitan TAFE, happy to learn new

          </p>

            >View my work</a
          >
        </div>

      <section class="py-8" aria-labelledby="featured-heading">
        <h2 id="featured-heading" class="text-2xl font-bold text-navy mb-6">
          Featured Projects
        </h2>
        <div class="grid gap-6 md:grid-cols-2">
          <article class="bg-white rounded-lg shadow p-4">
            <img
              src="https://opengraph.githubassets.com/1/KentSimon07/willitrun"
              alt="willitrun GitHub repository preview"
              class="w-full rounded"

              src="https://opengraph.githubassets.com/1/KentSimon07/C4Prog-WT-26S2-Portfolio--KENT-SIMON-"
              alt="Portfolio website GitHub repository preview"
              class="w-full rounded"
            />
            <h3 class="mt-3 text-lg font-bold text-navy">Portfolio Website</h3>
            <a
              href="mywork.html"
              class="inline-block mt-3 bg-blue text-white px-4 py-2 rounded hover:bg-navy"
              >View</a

          </article>

    <footer class="bg-navy text-white">
      <div class="max-w-6xl mx-auto flex items-center justify-between p-4">
        <p>&copy; 2026 Kent Simon</p>
        <ul class="flex gap-4 text-xl">
          <li>

            ></a>
          </li>
          <li>
            <a href="https://www.linkedin.com/" aria-label="LinkedIn"
              ><i class="fa-brands fa-linkedin"></i
            ></a>
          </li>
          <li>
            <a
              href="https://www.instagram.com/kenttsimon"
              aria-label="Instagram"
              ><i class="fa-brands fa-instagram"></i
            ></a>
          </li>
        </ul>
